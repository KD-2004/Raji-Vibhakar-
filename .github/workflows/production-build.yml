name: Production Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build + prerender
        run: npm run build

      - name: Verify generated static SEO output
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/insights/index.html
          test -f dist/stuttering-therapy/index.html
          test -f dist/insights/stuttering/index.html
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);

          if (urls.length !== 24) {
            throw new Error(`Expected 24 canonical sitemap URLs, found ${urls.length}`);
          }

          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk('dist');

          const banned = [
            'priceRange',
            'paymentAccepted',
            'currenciesAccepted',
            'MedicalProcedure',
            'FAQPage',
            'procedureType',
            'sameAs',
            'share.google',
            'appointment_success',
            'Free Live Hearing Aid Trial',
            'State Rank 1 Specialization',
            'reviewedBy'
          ];

          const violations = [];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const token of banned) {
              if (html.includes(token)) violations.push(`${file}: ${token}`);
            }
          }

          if (violations.length) {
            throw new Error('Production SEO validation failed:\n' + violations.join('\n'));
          }

          console.log(`Static SEO validation passed: ${urls.length} sitemap URLs, ${htmlFiles.length} HTML files.`);
          NODE
