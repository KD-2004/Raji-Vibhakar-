name: Production Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build + prerender
        run: npm run build

      - name: Verify generated static SEO output
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/insights/index.html
          test -f dist/stuttering-therapy/index.html
          test -f dist/insights/stuttering/index.html
          echo "Static SEO output checks passed."
